services:
  # Express Backend Web Service
  - type: web
    name: rythu-chutneys-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build --prefix server
    startCommand: npm run start --prefix server
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: rythu-chutneys-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_API_URL
        value: https://rythu-chutneys-backend.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: mekalalokesh2005@gmail.com
      - key: SMTP_PASS
        sync: false

  # React Frontend Static Site
  - type: static
    name: rythu-chutneys
    buildCommand: npm run install:all && npm run build:client
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rythu-chutneys-backend.onrender.com

databases:
  # PostgreSQL Database Instance
  - name: rythu-chutneys-db
    plan: free
    databaseName: rythuchutneys
    user: rythu_admin

