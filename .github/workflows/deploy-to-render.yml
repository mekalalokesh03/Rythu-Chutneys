name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID || 'srv-d96hbut8nd3s73bgspjg' }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "Error: RENDER_API_KEY secret is not set in GitHub repository settings."
            exit 1
          fi
          
          SERVICE_ID="${RENDER_SERVICE_ID:-srv-d96hbut8nd3s73bgspjg}"
          echo "Triggering deployment for Render Service ID: $SERVICE_ID"
          
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"true"}' \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")
            
          echo "Response: $response"
